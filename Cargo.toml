[package]
name = "ghostport"
version = "0.1.0"
edition = "2021"
description = "Encrypted, NAT-traversing port forwarder (Noise protocol) between a single pinned peer pair"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
snow = "0.9"
snowstorm = "0.4"
rand = "0.8"
base64 = "0.22"
# Already resolved transitively via snow -- not a new crate in the
# dependency tree, just made a direct dependency so keys::fingerprint
# can use it without reaching through another crate's internals.
sha2 = "0.10"
cybercore = { path = "/home/raven/.sysops/cybercore" }
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
# Local path, not crates.io -- gateflow isn't published yet. Used by
# src/tests_gateflow.rs to run the forward-link test across two real
# Linux network namespaces instead of one process on loopback.
gateflow = { path = "../../../Devspace/rust/gateflow" }
