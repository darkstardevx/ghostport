[package]
name = "ghostport"
version = "0.1.0"
edition = "2021"
description = "Encrypted, NAT-traversing port forwarder (Noise protocol) between a single pinned peer pair"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
snow = "0.9"
snowstorm = "0.4"
rand = "0.8"
base64 = "0.22"
cybercore = { path = "/home/raven/.sysops/cybercore" }
